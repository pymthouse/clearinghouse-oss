sonar.projectKey=pymthouse_clearinghouse-oss
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/tests/**,**/test/**,**/*_test.go,**/*.test.*,**/*.spec.*,**/test_*.py,**/*_test.py
sonar.exclusions=**/node_modules/**,**/.venv/**,**/venv/**,**/vendor/**,**/dist/**,**/build/**,**/coverage/**,**/target/**,**/*.generated.*

# Java analysis needs compiled bytecode and the provided Keycloak libraries.
sonar.java.binaries=keycloak-spi/target/classes
sonar.java.libraries=keycloak-spi/target/dependency/*.jar
